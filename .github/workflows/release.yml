name: Instaladores
# Genera los instaladores de CasaMail para Windows, macOS y Linux.
#  - Al FUSIONAR en main una versión nueva (sube el número en package.json), publica la Release "v<versión>" automáticamente
#    (con los instaladores y los archivos de auto-actualización). Así la app de escritorio se actualiza sola, sin pasos manuales.
#  - Al subir una etiqueta "v*" también publica.
#  - Con "Run workflow" (manual): genera los instaladores como artefactos; si marcas "publicar", además crea la Release.
#  - Firma (opcional): si defines los secretos de docs/FIRMA-INSTALADORES.md, los instaladores salen firmados; si no, sin firmar.
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar una Release con los instaladores (v<versión>)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  check:
    # Decide si hay que publicar: etiqueta v*, o 'publicar' manual, o un merge a main con una versión cuya Release aún no existe.
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.d.outputs.publish }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=${{ inputs.publicar }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"   # esa versión ya está publicada: no repetir
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"     # merge a main con versión nueva
          fi
  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          CSC_LINK: ${{ (matrix.name == 'windows' && secrets.WIN_CSC_LINK) || (matrix.name == 'macos' && secrets.MAC_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD) || (matrix.name == 'macos' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.name == 'windows' && secrets.WIN_CSC_LINK != '') || (matrix.name == 'macos' && secrets.MAC_CSC_LINK != '') }}
      - uses: actions/upload-artifact@v4
        with:
          name: CasaMail-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CasaMail ${{ needs.check.outputs.tag }}
          files: dist-all/*
          generate_release_notes: true
          make_latest: true
