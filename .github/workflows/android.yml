name: Android
# Genera la app Android de CasaMail (APK para probar y AAB para Google Play).
#  - Con "Run workflow" (manual) o al subir una etiqueta "android-v*".
#  - Si existen los secretos de la clave de subida, el AAB sale firmado; si no, sale sin firmar (solo sirve para probar el APK).
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Prueba de la lógica de conexión (sin Android)
        working-directory: android
        run: javac -d /tmp/cx app/src/main/java/app/casamail/movil/Conexion.java test/ConexionTest.java && java -cp /tmp/cx app.casamail.movil.ConexionTest
      - name: Clave de subida (si hay secretos)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "CASAMAIL_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; echo "FIRMADO=1" >> "$GITHUB_ENV"; fi
      - name: Compilar
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          CASAMAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CASAMAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CASAMAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CasaMail-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
