name: Publicar en Google Play
# Sube el AAB firmado a Google Play (Prueba interna) usando la API de Google Play Developer.
#  - Manual: pestaña Actions -> "Publicar en Google Play" -> Run workflow (eliges el segmento: internal/alpha/beta).
#  - O al crear una etiqueta "play-v*" (por ejemplo play-v0.4.13).
# Requisitos (secretos del repositorio):
#  - PLAY_SERVICE_ACCOUNT_JSON : clave JSON de una cuenta de servicio con permiso para publicar en Play.
#  - ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD : la clave de subida.
# La app ya debe existir en Play (con al menos una subida manual previa), como es el caso.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Segmento de Google Play"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Estado de la versión"
        type: choice
        default: completed
        options: [completed, draft]
  push:
    tags: ["play-v*"]
jobs:
  publicar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Asegurar la plataforma de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Comprobar que están los secretos necesarios
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$SA" ] || { echo "Falta el secreto PLAY_SERVICE_ACCOUNT_JSON (clave JSON de la cuenta de servicio de Google Play)."; exit 1; }
          [ -n "$KS" ] || { echo "Falta el secreto ANDROID_KEYSTORE_BASE64 (clave de subida). Sin firmar, Play no acepta el AAB."; exit 1; }

      - name: Nombre de versión (de package.json) y código de versión
        id: ver
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          # Código de versión siempre creciente y por encima de las subidas manuales: 1000 + número de ejecución.
          echo "code=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - name: Preparar la clave de subida
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Construir el AAB firmado
        working-directory: android
        env:
          CASAMAIL_KEYSTORE: ${{ runner.temp }}/upload.jks
          CASAMAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CASAMAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CASAMAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Subir a Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.casamail.movil
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          releaseName: ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
