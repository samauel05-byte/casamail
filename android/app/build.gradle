plugins { id("com.android.application") }

// Versión: la fija el flujo de GitHub (ANDROID_VERSION_CODE) o, en local, 1. Cada subida a Google Play necesita un código MAYOR que el anterior.
def vcode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
def vname = System.getenv("ANDROID_VERSION_NAME") ?: "0.4.7"

// La interfaz web (../public) se empaqueta dentro de la app: el modo demostración la muestra con datos de ejemplo, sin servidor.
def demoAssets = layout.buildDirectory.dir("generated/demo-assets")
tasks.register("copiarDemo", Copy) {
    from("../../public")
    into(demoAssets.map { it.dir("demo") })
}
tasks.named("preBuild") { dependsOn("copiarDemo") }

android {
    namespace = "app.casamail.movil"
    compileSdk = 36
    defaultConfig {
        applicationId = "app.casamail.movil"
        minSdk = 24          // Android 7.0 (2016): mínimo que exige la protección automática de Google Play
        targetSdk = 36
        versionCode = vcode
        versionName = vname
    }
    signingConfigs {
        // Clave de subida (upload key). Solo se usa si el flujo recibe los secretos; si no, el APK sale firmado con la clave de depuración.
        create("upload") {
            def ks = System.getenv("CASAMAIL_KEYSTORE")
            if (ks) {
                storeFile = file(ks)
                storePassword = System.getenv("CASAMAIL_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("CASAMAIL_KEY_ALIAS")
                keyPassword = System.getenv("CASAMAIL_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Sin minificar (R8): JavaMail usa reflexión y carga sus protocolos por nombre; el minificado provocaba un cierre al arrancar. La app pesa poco, así que no compensa el riesgo.
            minifyEnabled = false
            shrinkResources = false
            if (System.getenv("CASAMAIL_KEYSTORE")) signingConfig = signingConfigs.getByName("upload")
        }
    }
    sourceSets { main { assets.srcDir(demoAssets) } }
    // Desugaring: permite usar java.time y java.util.Base64 en Android 6/7 (API < 26), que es lo que necesita el motor de correo.
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; coreLibraryDesugaringEnabled = true }
    lint { abortOnError = false }
    packaging { resources { pickFirsts += ["META-INF/LICENSE.md", "META-INF/NOTICE.md", "META-INF/LICENSE", "META-INF/NOTICE", "META-INF/DEPENDENCIES"] } }
}

dependencies {
    // Cliente IMAP/SMTP (JavaMail para Android): el correo se gestiona dentro del propio móvil, sin servidor.
    implementation("com.sun.mail:android-mail:1.6.7")
    implementation("com.sun.mail:android-activation:1.6.7")
    // Hace que java.time y java.util.Base64 funcionen en Android 6/7.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
}
