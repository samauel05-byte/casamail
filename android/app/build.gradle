plugins { id("com.android.application") }

// Versión: la fija el flujo de GitHub (ANDROID_VERSION_CODE) o, en local, 1. Cada subida a Google Play necesita un código MAYOR que el anterior.
def vcode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
def vname = System.getenv("ANDROID_VERSION_NAME") ?: "0.3.6"

// La interfaz web (../public) se empaqueta dentro de la app: el modo demostración la muestra con datos de ejemplo, sin servidor.
def demoAssets = layout.buildDirectory.dir("generated/demo-assets")
tasks.register("copiarDemo", Copy) {
    from("../../public")
    into(demoAssets.map { it.dir("demo") })
}
tasks.named("preBuild") { dependsOn("copiarDemo") }

android {
    namespace = "app.casamail.movil"
    compileSdk = 36
    defaultConfig {
        applicationId = "app.casamail.movil"
        minSdk = 26
        targetSdk = 36
        versionCode = vcode
        versionName = vname
    }
    signingConfigs {
        // Clave de subida (upload key). Solo se usa si el flujo recibe los secretos; si no, el APK sale firmado con la clave de depuración.
        create("upload") {
            def ks = System.getenv("CASAMAIL_KEYSTORE")
            if (ks) {
                storeFile = file(ks)
                storePassword = System.getenv("CASAMAIL_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("CASAMAIL_KEY_ALIAS")
                keyPassword = System.getenv("CASAMAIL_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            if (System.getenv("CASAMAIL_KEYSTORE")) signingConfig = signingConfigs.getByName("upload")
        }
    }
    sourceSets { main { assets.srcDir(demoAssets) } }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    lint { abortOnError = false }
}
